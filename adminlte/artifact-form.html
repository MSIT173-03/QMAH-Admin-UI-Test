    <main class="app-main" id="main-content"><div class="app-content-header"><div class="container-fluid"><div class="row"><div class="col-sm-6"><h1 class="mb-0">編輯圖鑑條目</h1></div><div class="col-sm-6"><ol class="breadcrumb float-sm-end mb-0"><li class="breadcrumb-item"><a href="index.html">清明鑑定屋</a></li><li class="breadcrumb-item"><a href="artifacts.html">圖鑑管理</a></li><li class="breadcrumb-item active" aria-current="page">編輯圖鑑條目</li></ol></div></div></div></div><div class="app-content"><div class="container-fluid">
      <form class="row g-3" data-qmah-validation data-qmah-return="artifacts.html" novalidate>
        <div class="col-lg-8"><section class="card qmah-adminlte-card"><div class="card-header"><h2 class="card-title mb-0">基本資料</h2></div><div class="card-body"><div class="row g-3"><div class="col-md-8"><label class="form-label" for="artifact-name">文物名稱 <span class="text-danger">*</span></label><input id="artifact-name" class="form-control" type="text" value="汝窯 青瓷盤" required><div class="invalid-feedback">請輸入文物名稱。</div></div><div class="col-md-4"><label class="form-label" for="artifact-ref">文物編號 <span class="text-danger">*</span></label><input id="artifact-ref" class="form-control" type="text" value="故瓷018182N000000000" required><div class="invalid-feedback">請輸入文物編號。</div></div><div class="col-md-6"><label class="form-label" for="artifact-category">分類 <span class="text-danger">*</span></label><select id="artifact-category" class="form-select" required><option value="">請選擇分類</option><option selected>陶瓷</option><option>玉器</option><option>漆器</option><option>琺瑯器</option><option>繪畫</option><option>銅器</option><option>錢幣</option></select></div><div class="col-md-6"><label class="form-label" for="artifact-era">年代 <span class="text-danger">*</span></label><select id="artifact-era" class="form-select" required><option value="">請選擇年代</option><option selected>北宋</option><option>清</option><option>西漢</option><option>春秋</option></select></div><div class="col-md-6"><label class="form-label" for="artifact-era-original">原始年代文字</label><input id="artifact-era-original" class="form-control" type="text" value="北宋"></div><div class="col-md-6"><label class="form-label" for="artifact-creator">作者／窯口</label><input id="artifact-creator" class="form-control" type="text" value="汝窯"></div><div class="col-12"><label class="form-label" for="artifact-description">文物描述</label><textarea id="artifact-description" class="form-control" rows="4">器呈天青色，釉面開片自然，為北宋汝窯傳世器。</textarea></div><div class="col-md-6"><label class="form-label" for="artifact-size">尺寸文字</label><input id="artifact-size" class="form-control" type="text" value="高 3.2–3.7 公分"></div><div class="col-md-6"><label class="form-label" for="artifact-license">授權代碼</label><input id="artifact-license" class="form-control" type="text" value="CC-BY-4.0"></div></div></div></section></div>
        <div class="col-lg-4"><section class="card qmah-adminlte-card mb-3"><div class="card-header"><h2 class="card-title mb-0">圖片與來源</h2></div><div class="card-body"><label class="form-label" for="artifact-image">主圖路徑 <span class="text-danger">*</span></label><input id="artifact-image" class="form-control mb-3" type="text" value="catalog/ceramic/故瓷018182N000000000/primary.jpg" required><label class="form-label" for="artifact-source">來源網址 <span class="text-danger">*</span></label><input id="artifact-source" class="form-control mb-3" type="url" value="https://theme.npm.edu.tw/3d/Content.aspx?sno=04009221" required><label class="form-label" for="artifact-attribution">姓名標示</label><input id="artifact-attribution" class="form-control" type="text" value="國立故宮博物院 Open Data"></div></section><section class="card qmah-adminlte-card"><div class="card-header"><h2 class="card-title mb-0">狀態與題庫</h2></div><div class="card-body"><div class="form-check form-switch mb-3"><input id="artifact-active" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="artifact-active">啟用文物</label></div><div class="form-check form-switch mb-3"><input id="question-active" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="question-active">啟用鑑定題庫</label></div><label class="form-label" for="question-difficulty">題目難度</label><select id="question-difficulty" class="form-select mb-3"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select><label class="form-label" for="question-template">題型代碼</label><input id="question-template" class="form-control" type="text" value="VISUAL_COMPARE"></div></section></div>
        <div class="col-12 d-flex flex-wrap justify-content-end gap-2"><a class="btn btn-outline-secondary" href="artifacts.html">取消</a><button class="btn btn-primary" type="submit">儲存文物</button><p class="w-100 text-end text-body-secondary small mb-0" data-qmah-form-status aria-live="polite"></p><div class="alert alert-danger d-none w-100 mb-0" data-qmah-validation-summary role="alert"></div></div>
      </form>
